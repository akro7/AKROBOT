name: Egyptian Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch: # لتشغيل البوت يدوياً

# هذا الجزء يمنع تضارب النسخ (يحل مشكلة Error 409)
concurrency:
  group: bot-runtime
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # تسريع التحميل في المرات الجاية

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # تأكد أن الملف اسمه requirements1.txt فعلاً وموجود في الـ Root
          if [ -f requirements1.txt ]; then pip install -r requirements1.txt; fi
          # تثبيت المكتبة الأساسية احتياطياً لو مش موجودة في الملف
          pip install pyTelegramBotAPI requests 

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # ربط السيكرت اللي في جيتهب بالمتغير اللي الكود بيقرأه
          GROK_API_KEY: ${{ secrets.GROQ_KEY }}
          GROK_MODEL: "grok-2-latest"
        run: |
          echo "🚀 AKRO BOT v5.0 is starting..."
          python bot.py

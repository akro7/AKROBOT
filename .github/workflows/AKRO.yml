name: Egyptian Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements1.txt

      - name: Run Bot
        env:
          # سحب التوكن من السيكرتس (Secrets)
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py

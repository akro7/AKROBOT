name: Egyptian Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch: # لتشغيل البوت يدوياً من صفحة Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements1.txt

      - name: Run Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          # تم ربط المتغير الذي يقرأه الكود (GROK_API_KEY) بالسيكرت اللي سمّيته في جيتهب (GROQ_KEY)
          GROK_API_KEY: ${{ secrets.GROQ_KEY }}
        run: |
          echo "🤖 جاري تشغيل البوت..."
          python bot.py

name: GSI Super Builder SM-T509N
on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: 'رابط مباشر لملف الـ GSI (system.img)'
        required: true
        default: 'https://github.com/phhusson/treble_experimentations/releases/download/v2023.11.12/system-squeak-arm64-ab-vanilla.img.xz'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lz4 wget tar zip unzip xz-utils \
            android-sdk-libsparse-utils \
            git cmake ninja-build build-essential \
            pkg-config libssl-dev libbrotli-dev zlib1g-dev \
            libfmt-dev

          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"

          git clone --depth=1 --recurse-submodules \
            https://github.com/nmeum/android-tools android-tools-src
          cd android-tools-src
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_TOOLS_USE_BUNDLED_FMT=ON
          ninja -C build
          sudo find build -type f \( \
            -name 'lpmake'   -o \
            -name 'lpunpack' -o \
            -name 'lpadd'    -o \
            -name 'lpremove' -o \
            -name 'lpdump'   \
          \) -exec cp {} /usr/local/bin/ \;
          cd ..
          which lpunpack && which lpmake

      - name: Download Stock ROM and GSI
        run: |
          mkdir -p workdir/output
          cd workdir
          echo "Downloading Stock ROM..."
          wget -q -O stock_rom.zip "https://s08."

          echo "Downloading GSI Image..."
          wget -q -O gsi.img.xz "${{ github.event.inputs.gsi_url }}"
          xz -d gsi.img.xz || true

      - name: Extract Super.img
        run: |
          cd workdir
          unzip stock_rom.zip
          tar -xf AP_*.tar.md5 || tar -xf AP_*.tar || true
          lz4 -d super.img.lz4 super.img
          simg2img super.img super_raw.img
          rm -rf super.img super.img.lz4 stock_rom.zip AP_*.tar*

      - name: Unpack Super and Build GSI
        run: |
          cd workdir
          mkdir unpacked
          lpunpack super_raw.img unpacked/

          SYSTEM_SIZE=$(stat -c%s "unpacked/system.img")
          VENDOR_SIZE=$(stat -c%s "unpacked/vendor.img")
          PRODUCT_SIZE=$(stat -c%s "unpacked/product.img")
          ODM_SIZE=$(stat -c%s "unpacked/odm.img")

          cp gsi.img unpacked/system.img
          truncate -s $SYSTEM_SIZE unpacked/system.img

          lpmake --metadata-size 65536 --super-name super --metadata-slots 2 \
            --device super:4294967296 \
            --group main:4294967296 \
            --partition system:readonly:$SYSTEM_SIZE:main --image system=unpacked/system.img \
            --partition vendor:readonly:$VENDOR_SIZE:main --image vendor=unpacked/vendor.img \
            --partition product:readonly:$PRODUCT_SIZE:main --image product=unpacked/product.img \
            --partition odm:readonly:$ODM_SIZE:main --image odm=unpacked/odm.img \
            --sparse --output output/super_gsi.img

      - name: Create Odin Tar
        run: |
          cd workdir/output
          tar -cvf SM-T509N_GSI_Super.tar super_gsi.img
          echo "Build Complete!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T509N-GSI-ROM
          path: workdir/output/*.tar

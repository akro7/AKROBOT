name: GSI Super Builder SM-T509N
on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: 'رابط مباشر لملف الـ Stock ROM (zip) - من Samfw.com أو SamMobile'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lz4 wget tar zip unzip xz-utils \
            android-sdk-libsparse-utils \
            git python3 python3-pip \
            build-essential pkg-config

          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"

          git clone --depth=1 https://github.com/unix3dgforce/lpunpack.git /opt/lpunpack
          pip3 install --break-system-packages protobuf 2>/dev/null || \
          pip3 install protobuf 2>/dev/null || true

          sudo tee /usr/local/bin/lpunpack > /dev/null << 'EOF'
          #!/bin/bash
          exec python3 /opt/lpunpack/lpunpack.py "$@"
          EOF
          sudo chmod +x /usr/local/bin/lpunpack

          wget -q "https://github.com/leegarchat/lpmake-prebuilt/releases/latest/download/lpmake" \
            -O /tmp/lpmake || true
          if [ -f /tmp/lpmake ] && [ -s /tmp/lpmake ]; then
            sudo cp /tmp/lpmake /usr/local/bin/lpmake
            sudo chmod +x /usr/local/bin/lpmake
          fi

          echo "=== Tools check ==="
          lpunpack --help 2>&1 | head -3 || echo "lpunpack issue"
          which lpmake && lpmake --version 2>&1 | head -1 || echo "lpmake issue"

      - name: Download Stock ROM
        run: |
          mkdir -p workdir/output
          cd workdir

          # ✅ التحقق من الرابط أولاً
          echo "Checking URL..."
          HTTP_CODE=$(curl -o /dev/null -s -w "%{http_code}" \
            --max-time 15 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            "${{ github.event.inputs.stock_url }}")
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ] && [ "$HTTP_CODE" != "301" ]; then
            echo "❌ ERROR: URL returned HTTP $HTTP_CODE - الرابط لا يعمل!"
            echo "يرجى الحصول على رابط تنزيل مباشر من:"
            echo "  - https://samfw.com"
            echo "  - https://sammobile.com"
            exit 1
          fi

          echo "✅ URL is valid, downloading..."
          wget --progress=dot:giga \
            --user-agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -O stock_rom.zip \
            "${{ github.event.inputs.stock_url }}"

          echo "Download size: $(du -sh stock_rom.zip)"

      - name: Extract Super.img
        run: |
          cd workdir
          unzip stock_rom.zip
          tar -xf AP_*.tar.md5 || tar -xf AP_*.tar || true
          lz4 -d super.img.lz4 super.img 2>/dev/null || true
          simg2img super.img super_raw.img
          rm -f super.img super.img.lz4 stock_rom.zip AP_*.tar*

      - name: Unpack Super
        run: |
          cd workdir
          mkdir -p unpacked
          python3 /opt/lpunpack/lpunpack.py super_raw.img unpacked/
          echo "Partitions found:"
          ls unpacked/

      - name: Rebuild Super as GSI-ready
        run: |
          cd workdir

          SYSTEM_SIZE=$(stat -c%s "unpacked/system.img")
          VENDOR_SIZE=$(stat -c%s "unpacked/vendor.img")
          PRODUCT_SIZE=$(stat -c%s "unpacked/product.img")

          echo "system:  $SYSTEM_SIZE"
          echo "vendor:  $VENDOR_SIZE"
          echo "product: $PRODUCT_SIZE"

          LPMAKE_CMD="lpmake --metadata-size 65536 --super-name super --metadata-slots 2 \
            --device super:4294967296 \
            --group main:4294967296 \
            --partition system:readonly:$SYSTEM_SIZE:main --image system=unpacked/system.img \
            --partition vendor:readonly:$VENDOR_SIZE:main --image vendor=unpacked/vendor.img \
            --partition product:readonly:$PRODUCT_SIZE:main --image product=unpacked/product.img"

          if [ -f "unpacked/system_ext.img" ]; then
            SYSTEM_EXT_SIZE=$(stat -c%s "unpacked/system_ext.img")
            echo "system_ext: $SYSTEM_EXT_SIZE"
            LPMAKE_CMD="$LPMAKE_CMD \
              --partition system_ext:readonly:$SYSTEM_EXT_SIZE:main \
              --image system_ext=unpacked/system_ext.img"
          fi

          if [ -f "unpacked/odm.img" ]; then
            ODM_SIZE=$(stat -c%s "unpacked/odm.img")
            echo "odm: $ODM_SIZE"
            LPMAKE_CMD="$LPMAKE_CMD \
              --partition odm:readonly:$ODM_SIZE:main \
              --image odm=unpacked/odm.img"
          fi

          LPMAKE_CMD="$LPMAKE_CMD --sparse --output output/super_gsi.img"
          echo "Running lpmake..."
          eval $LPMAKE_CMD

      - name: Create Odin Tar
        run: |
          cd workdir/output
          tar -cvf SM-T509N_GSI_Super.tar super_gsi.img
          echo "Build Complete!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T509N-GSI-ROM
          path: workdir/output/*.tar

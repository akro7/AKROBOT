name: GSI Super Builder SM-T509N
on:
  workflow_dispatch:
    inputs:
      stock_url:
        description: 'رابط مباشر لملف الـ Stock ROM (zip)'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            lz4 wget tar zip unzip xz-utils \
            android-sdk-libsparse-utils \
            git python3 python3-pip \
            build-essential cmake ninja-build \
            pkg-config libssl-dev

          git config --global user.email "ci@github-actions.local"
          git config --global user.name "GitHub Actions"

          git clone --depth=1 https://github.com/unix3dgforce/lpunpack.git
          cd lpunpack
          sudo cp lpunpack.py /usr/local/bin/lpunpack
          sudo chmod +x /usr/local/bin/lpunpack
          cd ..

          wget -q https://github.com/sycomix/lptools/releases/download/latest/lpmake \
            -O /tmp/lpmake 2>/dev/null || \
          wget -q https://github.com/leegarchat/lpmake-prebuilt/releases/latest/download/lpmake \
            -O /tmp/lpmake 2>/dev/null || true

          if [ -f /tmp/lpmake ]; then
            sudo cp /tmp/lpmake /usr/local/bin/lpmake
            sudo chmod +x /usr/local/bin/lpmake
          fi

          echo "Tools check:"
          which lpunpack && which lpmake

      - name: Download Stock ROM
        run: |
          mkdir -p workdir/output
          cd workdir
          echo "Downloading Stock ROM..."
          wget --progress=dot:giga -O stock_rom.zip "${{ github.event.inputs.stock_url }}"

      - name: Extract Super.img
        run: |
          cd workdir
          unzip stock_rom.zip
          tar -xf AP_*.tar.md5 || tar -xf AP_*.tar || true
          lz4 -d super.img.lz4 super.img 2>/dev/null || true
          simg2img super.img super_raw.img
          rm -f super.img super.img.lz4 stock_rom.zip AP_*.tar*

      - name: Unpack Super
        run: |
          cd workdir
          mkdir -p unpacked
          lpunpack super_raw.img unpacked/
          echo "Partitions found:"
          ls unpacked/

      - name: Rebuild Super as GSI-ready
        run: |
          cd workdir

          SYSTEM_SIZE=$(stat -c%s "unpacked/system.img")
          VENDOR_SIZE=$(stat -c%s "unpacked/vendor.img")
          PRODUCT_SIZE=$(stat -c%s "unpacked/product.img")
          ODM_SIZE=$(stat -c%s "unpacked/odm.img")

          echo "system: $SYSTEM_SIZE"
          echo "vendor: $VENDOR_SIZE"
          echo "product: $PRODUCT_SIZE"
          echo "odm: $ODM_SIZE"

          lpmake --metadata-size 65536 --super-name super --metadata-slots 2 \
            --device super:4294967296 \
            --group main:4294967296 \
            --partition system:readonly:$SYSTEM_SIZE:main --image system=unpacked/system.img \
            --partition vendor:readonly:$VENDOR_SIZE:main --image vendor=unpacked/vendor.img \
            --partition product:readonly:$PRODUCT_SIZE:main --image product=unpacked/product.img \
            --partition odm:readonly:$ODM_SIZE:main --image odm=unpacked/odm.img \
            --sparse --output output/super_gsi.img

      - name: Create Odin Tar
        run: |
          cd workdir/output
          tar -cvf SM-T509N_GSI_Super.tar super_gsi.img
          echo "Build Complete!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SM-T509N-GSI-ROM
          path: workdir/output/*.tar

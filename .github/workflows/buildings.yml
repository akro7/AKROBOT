name: AKRO Buildings Bot Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # يعمل تلقائياً كل 6 ساعات لضمان استمرار البوت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements3.txt

      - name: Run AKRO Bot
        run: |
          python3 buildings.py

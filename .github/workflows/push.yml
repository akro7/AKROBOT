name: AKRO MEDIA BOT RUNNER

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات مباشرة إذا لم يوجد ملف requirements.txt
          pip install python-telegram-bot yt-dlp

      - name: Create Downloads Directory
        run: mkdir -p downloads

      - name: Run AKRO Bot
        env:
          # تأكد من إضافة التوكن في Settings > Secrets and variables > Actions
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python bot/bot.py

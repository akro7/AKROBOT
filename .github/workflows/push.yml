name: AKRO MEDIA BOT RUNNER

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Install & Update Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت المكتبات مع دعم محاكاة المتصفح المتقدمة
          pip install --upgrade python-telegram-bot setuptools yt-dlp
          # إضافة مكتبة curl-cffi اللي بتساعد في تخطي حظر الحماية
          pip install curl-cffi 

      - name: Create Downloads Directory
        run: mkdir -p downloads

      - name: Patch Bot Code (Smart Fix)
        run: |
          # هذا الأمر يقوم بحقن إعدادات التخطي داخل ملف bot.py تلقائياً قبل التشغيل
          sed -i "s/'quiet': True,/'quiet': True, 'impersonate': 'chrome', 'extractor_args': {'youtube': {'player_client': ['android', 'web']}}, 'nocheckcertificate': True,/g" bot/bot.py

      - name: Run AKRO Bot with Auto-Restart
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          # تشغيل البوت مع آلية إعادة تشغيل وتنظيف
          until python bot/bot.py; do
            echo "⚠️ تم اكتشاف توقف.. جاري تنظيف المجلد وإعادة التشغيل..."
            rm -rf downloads/*
            sleep 5
          done

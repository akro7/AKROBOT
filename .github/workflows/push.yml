name: AKRO MEDIA BOT RUNNER

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # نحدد وقت أقصى للعملية (مثلاً 5 ساعات ونصف) قبل أن يغلقها GitHub
    timeout-minutes: 330 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg aria2

      - name: Install & Update Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # تثبيت أحدث نسخة من المكتبات لضمان فك شفرات الروابط الجديدة
          pip install --upgrade python-telegram-bot yt-dlp setuptools

      - name: Create Downloads Directory
        run: mkdir -p downloads

      - name: Run AKRO Bot with Auto-Restart
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          # حلقة تكرارية بسيطة: لو البوت كراش (وقع) يرجع يفتح تاني لوحده
          until python bot/bot.py; do
            echo "البوت توقف بشكل مفاجئ، جاري إعادة التشغيل خلال 5 ثوانٍ..."
            sleep 5
          done
